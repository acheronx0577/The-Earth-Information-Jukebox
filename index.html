<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NASA Space Apps 2026 Countdown</title>
<style>
  :root{color-scheme:light dark;--text:#2c2c2b;--muted:#7d7a75;--line:#e6e5e3}
  *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  body{padding:8px 4px}.wrap{max-width:760px;margin:0 auto;text-align:center}
  h1{margin:0;font-size:17px;line-height:1.35;font-weight:650}.date{margin:4px 0 18px;color:var(--muted);font-size:13px}
  .timer{display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
  .unit{position:relative;padding:2px 12px}.unit:not(:last-child)::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:1px;background:var(--line)}
  .num{display:block;font-size:34px;line-height:1;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.label{display:block;margin-top:8px;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
  @media(max-width:480px){body{padding:6px 0}.unit{padding:2px 7px}.num{font-size:27px}h1{font-size:16px}.date{margin-bottom:15px}}
  @media(prefers-color-scheme:dark){:root{--text:#fff;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.18)}}
</style>
</head>
<body>
<main class="wrap">
  <h1>NASA Space Apps 2026</h1>
  <p class="date">November 14, 2026 · Pacific Time</p>
  <div class="timer" role="timer" aria-live="polite">
    <div class="unit"><span class="num" id="days">—</span><span class="label">Days</span></div>
    <div class="unit"><span class="num" id="hours">—</span><span class="label">Hours</span></div>
    <div class="unit"><span class="num" id="minutes">—</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="num" id="seconds">—</span><span class="label">Seconds</span></div>
  </div>
</main>
<script>
const target=new Date('2026-11-14T00:00:00-08:00').getTime();
const ids=['days','hours','minutes','seconds'];
function render(){let d=Math.max(0,target-Date.now());const v=[Math.floor(d/86400000),Math.floor(d/3600000)%24,Math.floor(d/60000)%60,Math.floor(d/1000)%60];ids.forEach((id,i)=>document.getElementById(id).textContent=String(v[i]).padStart(2,'0'))}render();setInterval(render,1000);
</script>
</body>
</html>
